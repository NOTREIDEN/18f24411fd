name: flaglock
on:
  push:
    branches: ["run/flaglock-**"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: [{"id":"v38v6-101","jar":"fl38v6.jar","seeds":"101,102,103,104,105,106","rooms":8,"spec":"0.05|40ms 10ms|"},{"id":"v38v6-107","jar":"fl38v6.jar","seeds":"107,108,109,110,111,112","rooms":8,"spec":"0.05|40ms 10ms|"},{"id":"v44a-101","jar":"fl44a.jar","seeds":"101,102,103,104,105,106","rooms":8,"spec":"0.05|40ms 10ms|"},{"id":"v44a-107","jar":"fl44a.jar","seeds":"107,108,109,110,111,112","rooms":8,"spec":"0.05|40ms 10ms|"},{"id":"v44b-101","jar":"fl44b.jar","seeds":"101,102,103,104,105,106","rooms":8,"spec":"0.05|40ms 10ms|"},{"id":"v44b-107","jar":"fl44b.jar","seeds":"107,108,109,110,111,112","rooms":8,"spec":"0.05|40ms 10ms|"}]
    env:
      K: ${{ secrets.K }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8'}
      - name: deps
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq xvfb openbox imagemagick x11-xserver-utils libgl1-mesa-dri mesa-utils libxrandr2 libxxf86vm1 >/dev/null 2>&1
      - name: setup
        run: |
          sh setup.sh >/dev/null
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K < o/flaglock.tgz.enc | tar -xz -C w
      - name: run
        run: |
          C=$PWD/w/proyectos/flaglock-v36r-2026-10-22/ci-2026-11-05
          JAVA8=$JAVA_HOME/bin/java bash $C/job.sh $C/jars/${{ matrix.jar }} ${{ matrix.seeds }} $RUNNER_TEMP/out ${{ matrix.rooms }} "${{ matrix.spec }}" >/dev/null 2>&1 || true
          ls $RUNNER_TEMP/out | wc -l
      - name: pack
        if: always()
        run: |
          tar -czf - -C $RUNNER_TEMP out 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:K > res.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "r-${{ matrix.id }}", path: res.enc}
