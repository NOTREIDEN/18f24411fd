name: cannonball
on:
  push:
    branches: ["run/cannonball-**"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        n: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: deps
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq xvfb openbox imagemagick x11-xserver-utils libgl1-mesa-dri libxrandr2 libxxf86vm1 libopenal1 >/dev/null 2>&1; echo deps ok
      - name: run
        env:
          K: ${{ secrets.K }}
        run: |
          sh setup.sh > /dev/null
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K < o/cannonball.tgz.enc | tar -xz -C w
          export JAVA8=$JAVA_HOME/bin/java
          bash w/proyectos/cannonball-2026-10-07/v47-2026-11-05/ci/run.sh ${{ matrix.n }} > /dev/null 2>&1 || true
          ls -la res.enc | awk '{print $5}'
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.n }}
          path: res.enc
